[workspace]
members = [
    "crates/monstermemory",
    "crates/monstermemory-core",
    "crates/monstermemory-macros",
    "crates/monstermemory-persistence",
    "xtask",
]
resolver = "2"
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.88"
authors = ["MonsterMemory contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Attraqualia/MonsterMemory"
homepage = "https://github.com/Attraqualia/MonsterMemory"
keywords = ["database", "in-memory", "mvcc", "typed", "embedded"]
categories = ["database", "data-structures"]

[workspace.dependencies]
arc-swap = "1.9.2"
atomic-write-file = "0.3.1"
crc32fast = "1.5.0"
hashbrown = "0.17.1"
im = "15.1.0"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
proc-macro2 = "1.0.101"
quote = "1.0.40"
serde = { version = "1.0.229", features = ["derive", "rc"] }
smallvec = "1.15.1"
syn = { version = "2.0.106", features = ["full", "extra-traits"] }
thiserror = "2.0.20"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
